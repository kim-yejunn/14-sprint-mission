spring:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100

logging:
  level:
    org.hibernate.SQL: info

server:
  port: 80

management:
  endpoint:
    health:
      show-details: never
  info.env.enabled: false