discodeit:
  seed: true
  storage:
    type: local
    local:
      root-path: .discodeit/storage

spring:
  application:
    name: Discodeit
  servlet:
    encoding:
      charset: UTF-8
      force: true

  datasource:
    url: jdbc:postgresql://localhost:5432/discodeit
    username: discodeit_user
    password: discodeit1234

  sql:
    init:
      mode: always

  jpa:
    hibernate:
      ddl-auto: create
    defer-datasource-initialization: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
        generate_statistics: true

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

springdoc:
  swagger-ui:
    tags-sorter: alpha          # Controller 알파벳 정렬
    operations-sorter: alpha    # URL 알파벳 정렬

server:
  port: 8080

